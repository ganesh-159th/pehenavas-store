name: Comprehensive CI/CD Pipeline

on:
  push:
    branches:
    - '**' # Triggers on every single branch push
  pull_request:
    branches:
    - '**' # Triggers on every pull request

jobs:
  quality-gate:
    name: Lint, Build & Unit Tests (with Coverage)
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci || npm install

    # Fail-Fast: Detect syntax or build errors immediately
    - name: 🔍 Run Linter
      run: npm run lint --if-present

    - name: 🛠️ Verify Application Build
      run: npm run build

    # Coverage threshold is enforced in vitest.config.js — this fails the job
    # if below the threshold, surfacing coverage as a check on every PR.
    - name: 🧪 Run Vitest Unit Tests (with coverage gate)
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
      run: npx vitest run --coverage

    - name: 📊 Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: coverage/
        if-no-files-found: ignore
        retention-days: 7

    # Artifact Collection: Store the compiled application
    - name: 🚀 Upload Production Build Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: production-build
        path: dist/
        retention-days: 7

  e2e-tests:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    # Cypress action installs dependencies and caches both the npm modules and
    # the Cypress binary across runs, speeding up E2E considerably.
    - name: 🌲 Run Cypress E2E Tests
      uses: cypress-io/github-action@v7
      with:
        build: npm run build
        start: npm run dev
        wait-on: 'http://localhost:3000'
        browser: chrome

    # Artifact Collection: Store screenshots if tests fail
    - name: 📸 Upload Cypress Screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: cypress-screenshots
        path: cypress/screenshots
        if-no-files-found: ignore
        retention-days: 7

    # Artifact Collection: Store video recordings of tests
    - name: 🎥 Upload Cypress Videos
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cypress-videos
        path: cypress/videos
        if-no-files-found: ignore
        retention-days: 7
